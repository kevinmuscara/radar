services:
  radar:
    build:
      context: .
    container_name: radar
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 80
      DB_PATH: /app/data/database.sqlite
    volumes:
      - radar-data:/app/data

volumes:
  radar-data:
